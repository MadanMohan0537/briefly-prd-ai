name: Remove provider footer

on:
  push:
    paths:
      - ".github/workflows/remove-provider-footer.yml"

permissions:
  contents: write

jobs:
  update-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove provider attribution
        run: |
          node -e "const fs=require('fs');const p='app/page.tsx';const s=fs.readFileSync(p,'utf8');const n=s.replace('        <span>Powered by DeepSeek</span>\n','');if(n===s)process.exit(1);fs.writeFileSync(p,n)"
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Remove DeepSeek attribution from footer"
          git push
